services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/linux/Dockerfile
      args:
        PYTHON_IMAGE: docker.m.daocloud.io/library/python:3.12-slim
    container_name: qixiangzhan-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - qixiangzhan-data:/data
    networks:
      - private

  caddy:
    image: docker.m.daocloud.io/library/caddy:2.10-alpine
    container_name: qixiangzhan-caddy
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile.edge:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - private

volumes:
  qixiangzhan-data:
  caddy-data:
  caddy-config:

networks:
  private:
    driver: bridge
